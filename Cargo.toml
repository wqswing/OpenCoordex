[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/gateway",
    "crates/controller",
    "crates/skills",
    "crates/store",
    "crates/governance",
    "crates/model_gateway",
    "crates/admin",
    "crates/sandbox",
    "crates/app/src-tauri",
    "crates/ecosystem",
    "crates/harness",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["OpenCoordex Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/wqswing/MultiAgent-AI"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }


# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["json-lines"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# LLM integration (Rig v0.28)
rig-core = { version = "0.28", features = ["derive"] }

# MCP Protocol
async-mcp = "0.1"

# Multi-modal support
image = "0.25"
base64 = "0.22"

# Cryptography
aes-gcm = "0.10"
secrecy = { version = "0.8", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
jsonwebtoken = "9"

# AST parsing for code skeletonization
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
schemars = "0.8"
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }

# Storage
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
url = "2"

# Phase 4: Production Hardening
redis = { version = "0.27", features = ["tokio-comp"] }
aws-config = "1.1"
aws-sdk-s3 = "1.14"

# Vector Database
qdrant-client = "1.12"

# Observability
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry = "0.24"
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp = "0.17"
tracing-opentelemetry = "0.25"
# opentelemetry-jaeger is deprecated, Jaeger now supports OTLP directly

# Error handling
thiserror = "1"
anyhow = "1"

# Configuration
config = "0.14"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# RegEx and JSON validation
regex = "1.10"
jsonschema = "0.18"

# Internal crates
# Internal crates
multi_agent_core = { path = "crates/core" }
multi_agent_gateway = { path = "crates/gateway" }
multi_agent_controller = { path = "crates/controller" }
multi_agent_skills = { path = "crates/skills" }
multi_agent_store = { path = "crates/store" }
multi_agent_governance = { path = "crates/governance" }
multi_agent_model_gateway = { path = "crates/model_gateway" }
multi_agent_admin = { path = "crates/admin" }
multi_agent_sandbox = { path = "crates/sandbox" }
multi_agent_ecosystem = { path = "crates/ecosystem" }
multi_agent_harness = { path = "crates/harness" }

[package]
name = "opencoordex"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "opencoordex"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
secrecy.workspace = true

multi_agent_core.workspace = true
multi_agent_gateway.workspace = true
multi_agent_controller.workspace = true
multi_agent_skills.workspace = true
multi_agent_store.workspace = true
multi_agent_governance.workspace = true
multi_agent_model_gateway.workspace = true
multi_agent_admin.workspace = true
multi_agent_sandbox.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true, features = ["full", "test-util"] }
redis = { version = "0.27", features = ["tokio-comp"] }
uuid = { version = "1", features = ["v4"] }
multi_agent_harness = { workspace = true }
tempfile = "3"
rusqlite.workspace = true

